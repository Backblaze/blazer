# Catches accidental references; the PR checkout supplies the script, so this is not tamper-proof.
name: Internal reference guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  # Maintainers add keys or hosts here; changes require a /.github/ code-owner review.
  TRACKER_KEYS: 'B2|DEV|DEVDOCS|DOCS|HD'
  INTERNAL_HOSTS: 'backblaze\.atlassian\.net|atlassian\.net'

jobs:
  internal-reference-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Scan pull request
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          guard=scripts/internal-reference-guard.sh
          status=0
          "$guard" title "$PR_TITLE" || status=1
          "$guard" body "$PR_BODY" || status=1
          git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' path; do
            "$guard" file "$path" || status=1
          done < "$RUNNER_TEMP/changed-files"
          git rev-list "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commits"
          while IFS= read -r sha; do
            message=$(git show -s --format=%B "$sha")
            "$guard" commit "$sha" "$message" || status=1
          done < "$RUNNER_TEMP/commits"
          exit "$status"
