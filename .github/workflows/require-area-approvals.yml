name: Require area-owner approvals

# Posts a commit status (`area-owner-approvals`) that stays red until every
# AREA the PR touches has been approved by at least one of that area's owners.
# Areas + owners are defined ONCE in .github/CODEOWNERS. This workflow derives
# the required reviewers from CODEOWNERS + the PR's changed files, so there is
# no roster to keep in sync.
#
# This is intentionally a SOFT guardrail: it is NOT wired into branch protection, so it
# never blocks a merge. The red/green status is a notification signal that flags which area
# owners still need to review; merging stays at the team's discretion.
#
# Behaviour:
# - Only owners with write, maintain or admin permission count, matching GitHub's native
#   CODEOWNERS; an area with no such owner stays red.
# - The PR author counts as implicitly approved for areas they own.
# - An approval counts only for the commit it was given on: a review whose commit_id is not
#   the PR's current head SHA is ignored, so a new push needs fresh approvals. A
#   CHANGES_REQUESTED review keeps blocking whatever commit it was given on (latest review
#   per user), so a new commit never silently clears it.
# - For each touched area: satisfied when >=1 owner's latest review is APPROVED and
#   no owner's latest review is CHANGES_REQUESTED.
# - A trailing `*` catch-all in CODEOWNERS makes the default owners responsible for any
#   path no more-specific rule matches, so every changed file resolves to some area. As
#   defense-in-depth, if (despite the catch-all) no rule matches, the gate fails safe
#   (red) rather than passing, add a rule in .github/CODEOWNERS to resolve it.
#
# The rules live in scripts/area-owner-approvals.py, tested offline by
# scripts/area-owner-approvals_test.sh (`make scripts-test`).
#
# To change ownership, edit .github/CODEOWNERS only.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  pull-requests: read
  statuses: write
  contents: read

jobs:
  check:
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # One run per PR at a time, so an older run cannot post its status after a newer one. Set on the
    # job, not the workflow, so a skipped run (draft, Dependabot) never cancels a real one.
    concurrency:
      group: area-owner-approvals-${{ github.event.pull_request.number || github.event.review.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR checkout supplies the script (as the workflow file itself does under pull_request),
      # so like the rest of this soft gate it is not tamper-proof.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts/area-owner-approvals.py
          sparse-checkout-cone-mode: false
      - name: Compute area-owner approval status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.review.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Fallback SHA so the failure trap can still post a status if the
          # PR_JSON fetch below fails before HEAD_SHA is computed.
          HEAD_SHA="$EVENT_HEAD_SHA"
          STATUS_POSTED=0

          post_status() {
            local state="$1"
            local description="${2:0:140}"
            [ -n "$HEAD_SHA" ] || return 0
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$state" \
              -f context="area-owner-approvals" \
              -f description="$description" \
              -f target_url="$RUN_URL" >/dev/null
            STATUS_POSTED=1
          }

          on_error() {
            if [ "$STATUS_POSTED" -eq 0 ]; then
              post_status error "Workflow failed; see Actions logs." || true
            fi
          }
          trap on_error ERR

          # Match GitHub's native CODEOWNERS engine (gitignore-style globs).
          python3 -m pip install --quiet --disable-pip-version-check pathspec==1.1.1

          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          HEAD_SHA=$(jq -r .head.sha <<<"$PR_JSON")
          BASE_SHA=$(jq -r .base.sha <<<"$PR_JSON")
          AUTHOR=$(jq -r .user.login <<<"$PR_JSON")
          export AUTHOR HEAD_SHA

          # Read CODEOWNERS from the PR's BASE commit, not the checked-out merge ref, so a
          # PR that edits CODEOWNERS cannot grade itself against its own modified version.
          # Tolerate a 404 (CODEOWNERS may not exist on the base for the first PR that adds it).
          CODEOWNERS_FILE="$RUNNER_TEMP/CODEOWNERS"
          export CODEOWNERS_FILE
          if ! gh api "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE_SHA" --jq '.content' 2>/dev/null | base64 --decode > "$CODEOWNERS_FILE"; then
            : > "$CODEOWNERS_FILE"
          fi

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' \
            > "$RUNNER_TEMP/files.txt"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            > "$RUNNER_TEMP/reviews.json"

          # GitHub ignores code owners without write access; so does this gate.
          WRITERS_FILE="$RUNNER_TEMP/writers.txt"
          export WRITERS_FILE
          : > "$WRITERS_FILE"
          for owner in $(grep -v '^[[:space:]]*#' "$CODEOWNERS_FILE" | awk '{for (i = 2; i <= NF; i++) print $i}' | tr -d '@' | sort -u); do
            case $owner in */*) continue ;; esac # teams cannot submit reviews
            perm=$(gh api "repos/$REPO/collaborators/$owner/permission" --jq .permission 2>/dev/null || echo none)
            case $perm in admin | maintain | write) echo "$owner" >> "$WRITERS_FILE" ;; esac
          done

          python3 "$GITHUB_WORKSPACE/scripts/area-owner-approvals.py"

          state=$(sed -n '1p' "$RUNNER_TEMP/gate.out")
          description=$(sed -n '2p' "$RUNNER_TEMP/gate.out")
          echo "state=$state"
          echo "description=$description"

          post_status "$state" "$description"
