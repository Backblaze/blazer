name: Mutation testing

on:
  pull_request:
  schedule:
    # Sunday 02:00 Costa Rica (UTC-6, no DST) = 08:00 UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-code:
    name: changed code
    if: ${{ github.event_name == 'pull_request' && github.repository == 'Backblaze/blazer' && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - name: Install Gremlins
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Mutate changed B2 and base code
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: ''
          B2_APPLICATION_KEY: ''
          B2_ACCOUNT_ID: ''
          B2_ACCOUNT_KEY: ''
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -o pipefail
          {
            status=0
            for package in b2 base; do
              if ! gremlins unleash --diff "origin/${BASE_REF}" --workers 2 --output "mutation-${package}.json" "./${package}"; then
                status=1
              fi
            done
            exit "$status"
          } 2>&1 | tee mutation.log
      - name: Write mutation summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## Mutation testing: changed code'
            echo
            if [ -f mutation.log ]; then
              tail -n 40 mutation.log
            else
              echo 'Mutation testing did not produce a report.'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            mutation-*.json
            mutation.log
          if-no-files-found: warn
          retention-days: 30

  full-suite:
    name: full suite
    if: ${{ github.event_name != 'pull_request' && github.repository == 'Backblaze/blazer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - name: Install Gremlins
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Mutate B2 and base code
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: ''
          B2_APPLICATION_KEY: ''
          B2_ACCOUNT_ID: ''
          B2_ACCOUNT_KEY: ''
        shell: bash
        run: |
          set -o pipefail
          {
            status=0
            for package in b2 base; do
              if ! gremlins unleash --workers 2 --output "mutation-${package}.json" "./${package}"; then
                status=1
              fi
            done
            exit "$status"
          } 2>&1 | tee mutation.log
      - name: Write mutation summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## Mutation testing: full suite'
            echo
            if [ -f mutation.log ]; then
              tail -n 40 mutation.log
            else
              echo 'Mutation testing did not produce a report.'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            mutation-*.json
            mutation.log
          if-no-files-found: warn
          retention-days: 30
