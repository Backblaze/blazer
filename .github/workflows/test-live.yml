name: Live integration tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 6 * * 5'

permissions:
  contents: read

concurrency:
  group: test-live
  cancel-in-progress: false

jobs:
  test-live:
    if: ${{ github.repository == 'Backblaze/blazer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: live-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Check live credentials
        id: creds
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          if [[ -z "$B2_APPLICATION_KEY_ID" || -z "$B2_APPLICATION_KEY" ]]; then
            echo '::error::The live-tests environment requires B2_APPLICATION_KEY_ID and B2_APPLICATION_KEY.'
            exit 1
          fi
      - name: Remove stale test buckets
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: go run ./internal/bin/cleanup/cleanup.go
      - name: Run live integration tests
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: go test -json -count=1 -timeout 30m ./b2/... ./base/... > test.json
      - name: Report live test results
        if: ${{ always() && steps.creds.outcome == 'success' }}
        run: scripts/live-test-report.sh test.json
      - name: Upload test log
        if: ${{ always() && steps.creds.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-test-json
          path: test.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove test buckets
        if: ${{ always() && steps.creds.outcome == 'success' }}
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: go run ./internal/bin/cleanup/cleanup.go

  # Keeps one open issue while live tests fail on main, so a red run is never silent.
  report-failure:
    needs: test-live
    if: ${{ failure() && github.repository == 'Backblaze/blazer' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live integration tests are failing on main"
          body="Run $RUN_URL failed (trigger: $GITHUB_EVENT_NAME, commit $GITHUB_SHA). See the run summary for the failing tests."
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
