name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go mod verify

  lint:
    name: lint
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # The base revision must be available for incremental lint.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Existing findings are scoped out; check this PR or the latest master push.
          args: --new-from-rev=${{ github.event_name == 'pull_request' && 'origin/master' || 'HEAD^' }} ./...

  test:
    name: test / Go ${{ matrix.go-version }} / ${{ matrix.os }}
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Go supports only the latest two releases. Test the oldest still-supported
        # version and latest (stable). When a new Go ships, bump the pinned version
        # to the new latest-minus-one release (for example, 1.26 becomes 1.27 when
        # 1.28 is stable).
        go-version: ['1.26', stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: '**/go.sum'
      - run: go test -race -shuffle=on -coverprofile=cover.out ./...
        shell: bash # Windows PowerShell splits cover.out into a separate .out package.
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go-${{ matrix.go-version }}-${{ matrix.os }}
          path: cover.out
          if-no-files-found: warn
          retention-days: 7

  b2keys:
    name: b2keys
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - run: go build ./...
        working-directory: bin/b2keys
      - run: go test ./...
        working-directory: bin/b2keys

  crosscompile:
    name: crosscompile / ${{ matrix.goos }} / ${{ matrix.goarch }}
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: '386'}
          - {goos: linux, goarch: arm}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  ci-summary:
    name: ci-summary
    needs: [checks, lint, test, b2keys, crosscompile]
    if: ${{ always() && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every core job to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          B2KEYS_RESULT: ${{ needs.b2keys.result }}
          CROSSCOMPILE_RESULT: ${{ needs.crosscompile.result }}
        run: |
          for result in "$CHECKS_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$B2KEYS_RESULT" "$CROSSCOMPILE_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::A required CI job finished with result: $result"
              exit 1
            fi
          done
