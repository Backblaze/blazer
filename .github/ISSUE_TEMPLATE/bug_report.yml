name: Bug report
description: Something in Blazer behaves incorrectly.
labels: [bug]
type: Bug
body:
  - type: input
    id: version
    attributes:
      label: Blazer version
      description: Tag or commit, from `go list -m github.com/Backblaze/blazer`.
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version and OS
      placeholder: go1.27.3 linux/amd64
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code and steps. Never paste application keys or auth tokens.
      render: go
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Redact keys, tokens and bucket names you consider private.
      render: text
