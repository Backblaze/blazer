version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /bin/b2keys
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    milestone: 1
    groups:
      non-major:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    milestone: 1
    groups:
      actions:
        patterns:
          - "*"
