kind: Changed
body: '**Breaking:** NewReader and NewRangeReader on an Object with a resolved ID now read that version, even after its name is overwritten. Uploads, Copy, Compose, listings, Attrs, Delete, Hide, Cancel, UpdateFileRetention and UpdateFileLegalHold can resolve the ID, even if a subsequent request fails. A deleted pinned version returns not-found; Hide leaves its pinned content readable by ID. Use a fresh bucket.Object(name) handle to read the latest visible version. Fresh handles resolve the name once, then use the ID for subsequent chunks and retries; transports must allow b2_download_file_by_id.'
time: 2026-11-20T17:00:00-06:00
