kind: Added
body: '`(*b2.Bucket).Compose` builds a large file from ordered uploaded and server-side copied parts, using `b2_copy_part`. It accepts content type, file info, SHA1, last-modified time, and Object Lock options; defaults its content type to `application/octet-stream`; validates part sizes, copy ranges, and known totals up to 10 TB (10,000,000,000,000 bytes) before starting; permits overlapping copied ranges; and cancels an unfinished file if a part fails, even after caller cancellation.'
