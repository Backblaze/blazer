kind: Fixed
body: Ambiguous failures while creating keys or buckets, starting or finishing large files, hiding or copying files, or deleting file versions now return OutcomeUnknown with zero automatic retries and match ErrOutcomeUnknown through errors.Is. Transport causes remain available through errors.Is/errors.As, and Idempotent exposes the retry-safety policy; retryable 429/503, definite pre-send failures, reads, and reauthentication remain supported (#172).
