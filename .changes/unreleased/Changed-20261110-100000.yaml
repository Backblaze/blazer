kind: Changed
body: "**Breaking:** `(*b2.Client).CreateKey` rejects explicitly empty `b2.BucketIDs` scopes or any empty ID with `b2.ErrInvalidBucketIDs`; `(*b2.Bucket).CreateKey` rejects this client-only option even when empty, with `b2.ErrBucketIDsOnBucket`. Omit `BucketIDs` for an intentional account-wide key, or provide non-empty IDs through `Client.CreateKey` for a scoped key."
time: 2026-11-10T10:00:00-06:00
