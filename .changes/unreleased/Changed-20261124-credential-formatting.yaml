kind: Changed
body: '**Breaking:** Diagnostic fmt output changes for base.AuthData, base.B2, base.Bucket, base.File, base.LargeFile, base.Key, base.URL, base.FileChunk, b2.AuthData, b2.Client, b2.Bucket, b2.InMemoryAccountInfo, b2.WebhookNotificationTarget and b2.NotificationCustomHeader. Credential containers use type labels and redacted credentials instead of raw struct output; file and bucket metadata and large-file IDs remain visible (for example, base.File{Name:cat.jpg Size:42 ... redacted}). Callers must use explicit fields or accessors for credentials and must not parse diagnostic fmt output. Public credential fields and JSON persistence are unchanged.'
time: 2026-11-24T12:00:00-06:00
