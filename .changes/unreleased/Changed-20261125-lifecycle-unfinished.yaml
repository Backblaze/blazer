body: '**Breaking:** Add DaysUnfinishedUntilCanceled to b2.LifecycleRule and base.LifecycleRule so unfinished large-file lifecycle rules round-trip. Unchanged lifecycle rules retain unknown server fields; changing any rule replaces the entire slice using the known fields. Callers using unkeyed struct literals must add the field or switch to keyed literals.'
