kind: Added
body: '`b2.WithProgress` reports byte-level upload progress, and `b2.Reader.Progress` reports byte-level download progress. Callbacks are serialized off transfer locks and finish with a terminal value; known upload sizes and finite download ranges report their actual totals. Upload progress also credits completed parts already present when resuming. Reaching the total or receiving a terminal callback does not confirm successful completion or replace checking Writer.Close or read errors.'
