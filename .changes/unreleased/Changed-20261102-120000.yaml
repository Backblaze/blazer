kind: Changed
body: "**Breaking:** `(*base.B2).CreateKey`, `CreateKeyMultiBucket`, and `(*base.Bucket).GetDownloadAuthorization` now reject negative lifetimes, fractional seconds, and lifetimes of 1000 days or more with `base.ErrInvalidDuration`. This also applies to `b2.Lifetime`, `b2.Deadline`, `Bucket.AuthToken`, and `Object.AuthURL`. Pass positive whole seconds below 1000 days for keys, or zero for a non-expiring key; download authorization requires whole seconds from 1 to 604800."
time: 2026-11-02T12:00:00.000000-06:00
