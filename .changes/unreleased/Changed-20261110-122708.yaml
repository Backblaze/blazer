kind: Changed
body: >-
  **Breaking:** Object.NewRangeReader with length 0 returns no bytes instead of
  reading the rest of the object. Pass a negative length to read the remainder.
  Progress callbacks measure transfer activity rather than service acceptance;
  reaching the total or receiving a terminal callback does not replace checking
  Writer.Close or read errors.
