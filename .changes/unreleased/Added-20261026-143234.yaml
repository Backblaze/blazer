kind: Added
body: '`b2.WithSSEB2("AES256")` requests SSE-B2 for one upload without changing the bucket default. Resumed uploads validate the existing encryption mode and algorithm. An explicit writer encryption option overrides inherited client defaults. Passing SSE-B2 and SSE-C options to the same `NewWriter` call causes a non-empty `Write` and `Close` to return an error.'
