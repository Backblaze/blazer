kind: Fixed
body: "Large-file HEAD lookups and downloads by ID or name no longer fail on 32-bit systems when Content-Length exceeds the platform's maximum int. base.FileReader.ContentLength saturates at that maximum without limiting the response body; Object.Attrs and Delete can still resolve the file ID. Bounded Reader downloads treat saturated HEAD sizes as unknown for progress instead of returning an empty range (#343)."
time: 2026-11-10T11:00:00-06:00
