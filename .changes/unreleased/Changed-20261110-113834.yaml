kind: Changed
body: '**Breaking:** The default `b2/sync.Sync` comparison and `CompareModTime` now use modification times alone at millisecond resolution; use `WithCompare(CompareSize)` or `WithCompare(CompareSHA1)` to detect size/content changes with unchanged times. Sync supports Linux, macOS and Windows, rejects unsafe file replacements there, and returns an error wrapping `errors.ErrUnsupported` with GOOS/GOARCH on all other targets before walking or sending requests; those targets remain buildable.'
