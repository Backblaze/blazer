kind: Changed
body: "**Breaking:** Ranged `DownloadFile*` calls now return the new `base.ErrInvalidRangeResponse` for HTTP 200 at a nonzero offset, an overlong HTTP 200 or 206 response, a chunked response without `Content-Length`, or a missing or invalid `Content-Range` on HTTP 206. Callers should handle this error and ensure their server or transport honors `Range` requests (#179)."
