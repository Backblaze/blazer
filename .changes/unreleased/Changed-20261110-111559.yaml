kind: Changed
body: "**Breaking:** `(*b2.Bucket).Update` now omits replication settings when `BucketAttrs.ReplicationConfig` is nil, and rejects unreadable existing replication configurations, empty configurations, and nil or empty destination key maps before HTTP. To change replication, use a key with `readBucketReplications` and supply a non-empty source or destination configuration; leave `ReplicationConfig` nil to preserve existing settings, and do not use empty maps to clear replication."
time: 2026-11-10T11:15:59.336785-06:00
