kind: Changed
body: "**Breaking:** `(*b2.Client).NewBucket` validates replication settings before creating a bucket, and `(*b2.Bucket).Update` omits settings when `BucketAttrs.ReplicationConfig` is nil. Both reject empty configurations and nil/empty destination maps that the current encoder omits; partial replication updates also reject unreadable existing settings. Use nil to leave replication unchanged, including unreadable settings; supply valid role data with normal bucket-update and `writeBucketReplications` permissions, plus `readBucketReplications` when preserving an unspecified role, or supply both roles for an explicit complete replacement. Empty maps are not supported clearing operations."
time: 2026-11-10T11:15:59.336785-06:00
