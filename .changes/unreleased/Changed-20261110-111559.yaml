kind: Changed
body: "**Breaking:** `(*b2.Client).NewBucket` validates replication settings before creating a bucket, and `(*b2.Bucket).Update` omits settings when `BucketAttrs.ReplicationConfig` is nil. Both reject empty configurations; partial replication updates also reject unreadable existing settings. Use nil to leave replication unchanged, including unreadable settings; supply valid role data with normal bucket-update and `writeBucketReplications` permissions, plus `readBucketReplications` when preserving an unspecified role, or supply both roles for an explicit complete replacement. Nil/empty destination maps retain their existing wire encoding for B2 to validate and are not supported clearing operations."
