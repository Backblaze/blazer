kind: Changed
body: >-
  **Breaking:** Writer.Close now waits for in-flight part uploads and, with
  WithCancelOnError, for b2_cancel_large_file and errf to finish. An errf that calls
  Close or waits on the goroutine calling Close deadlocks. Bound the cancellation
  RPC's wait with a deadline on the context returned by ctxf; errf must return
  promptly, as that deadline does not bound the callback.
