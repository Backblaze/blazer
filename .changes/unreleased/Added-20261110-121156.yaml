kind: Added
body: '`b2.ErrInvalidAccountInfo` lets callers recognize malformed or oversized cached sessions after `AccountInfoFile.AuthData` with `errors.Is`. Custom `AccountInfo` stores can wrap it with `ok=false` to request reauthorization; storage errors and every `Set` or `Clear` failure still reach the caller.'
